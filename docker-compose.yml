# Ambiente de desenvolvimento completo: app (hot reload) + Postgres.
#
#   docker compose up          # sobe tudo; abra http://localhost:3100
#   docker compose up -d       # em segundo plano
#   docker compose down        # para tudo (mantém os dados do banco)
#   docker compose down -v     # para tudo e APAGA o banco
#
# Porta 3100 no host (3000 costuma estar ocupada por outro projeto).
#
# Primeira vez / depois de mudar package.json ou prisma/schema.prisma:
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: petroprep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petroprep
      POSTGRES_PASSWORD: petroprep
      POSTGRES_DB: petroprep
    ports:
      - "5434:5432" # host 5434 → evita conflito com Postgres local (5432 e 5433)
    volumes:
      - petroprep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petroprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: petroprep-app
    restart: unless-stopped
    # --webpack + WATCHPACK_POLLING: Turbopack não detecta mudanças no bind mount
    # do Windows; o watcher do Webpack com polling detecta (HMR fica ~1-2s mais
    # lento, aceitável). Para edição intensa, prefira `npm run dev` no host.
    command: sh -c "npx prisma generate && npx prisma db push --skip-generate --accept-data-loss && npx prisma db seed && npm run dev -- -H 0.0.0.0 --webpack"
    environment:
      DATABASE_URL: postgresql://petroprep:petroprep@db:5432/petroprep?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # segredo de dev; em produção defina AUTH_SECRET de verdade
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-local-nao-use-em-producao}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      # volumes anônimos: usam o que está DENTRO da imagem, não o do host
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  petroprep-pgdata:
